services:
  ui:
    build: ./ui
    container_name: resumer-ui
    ports:
      - "8080:80"
    depends_on:
      - app
    profiles:
      - prod

  ui-dev:
    image: node:20-alpine
    container_name: resumer-ui-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app
    environment:
      - VITE_API_URL=http://192.168.1.67:8000
    depends_on:
      - app

  app:
    build: ./app
    container_name: resumer-app
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app
      - ./generated_resumes:/app/generated_resumes
      - ./resume_templates:/app/resume_templates
      - ./app/logs:/app/logs
    env_file:
      - ./app/.env
    depends_on:
      - db

  db:
    image: postgres:13
    container_name: resumer-db
    volumes:
      - ./db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=resumer
    ports:
      - "5433:5432"

volumes:
  db_data:
