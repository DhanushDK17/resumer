name: ui-build

on:
  push:
    paths:
      - "ui/**"
      - ".github/workflows/ui-build.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/ui-build.yml"

jobs:
  build-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
